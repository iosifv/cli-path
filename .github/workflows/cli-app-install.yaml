name: cli-app-install
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Per the release schedule: https://nodejs.org/en/about/releases/
        # 22.x is in maintenance and 24.x is Active LTS. Kept in step with
        # cli-app-test-build.yaml's matrix — see the note there on why 26.x is not included yet.
        node-version: [22.x, 24.x]
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3.5.1
        with:
          node-version: ${{ matrix.node-version }}

      - name: NPM Global Install
        run: npm install -g cli-path
      - name: Display clip help
        run: clip --help
