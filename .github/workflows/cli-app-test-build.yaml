name: cli-app-test-build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Per the release schedule: https://nodejs.org/en/about/releases/
        # 22.x is in maintenance and 24.x is Active LTS.
        #
        # 26.x is deliberately NOT here yet. mocha@10's yargs (16.2.0) declares "type": "module"
        # while shipping an extensionless ./yargs file containing require(), which Node 26 loads
        # as ESM — the suite dies with "require is not defined in ES module scope" before running
        # a single test. mocha@11 (yargs 17.7.3) fixes it; adding 26.x is blocked on that bump,
        # tracked in the bump-dev-tooling-dependencies change.
        #
        # Coverage runs on the whole matrix, not just one entry: every matrix entry produced
        # identical figures when fix-esm-coverage-reporting measured the baseline, and running on
        # all of them costs nothing extra here while catching a future version-dependent gap
        # immediately rather than by luck of which entry happens to be checked.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v3.2.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3.5.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - name: Yarn Install
        run: cd /home/runner/work/cli-path/cli-path/cli-app && yarn
      - name: Run tests
        run: cd /home/runner/work/cli-path/cli-path/cli-app && yarn test
      - name: Check coverage
        run: cd /home/runner/work/cli-path/cli-path/cli-app && yarn coverage
      # - name: Display cli-app version
      #   run: cd /home/runner/work/cli-path/cli-path/cli-app && yarn start --version
      - name: Display cli-app help
        run: cd /home/runner/work/cli-path/cli-path/cli-app && yarn start --help
