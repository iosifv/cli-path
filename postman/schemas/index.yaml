openapi: 3.0.0
info:
  description: "Hosted API behind the cli-path terminal client, backed by OpenRouteService and deployed as Vercel Functions"
  version: 0.2.0
  title: Cli-Path
  contact:
    email: dev@iosifv.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Healthcheck
    description: Unauthenticated, unmetered liveness and quota status
  - name: PathSearch
    description: Fuzzy address search
  - name: Directions
    description: Find the route from an origin to a destination
paths:
  /healthcheck:
    get:
      tags:
        - Healthcheck
      summary: Reports configuration and current quota usage
      description: Requires no bearer token and does not consume monthly quota.
      operationId: healthcheckGet
      security: []
      responses:
        "200":
          description: Service reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckResponse"
        "503":
          description: Usage accounting is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Healthcheck
      summary: Reports configuration and current quota usage
      description: Identical to GET /healthcheck; accepted on either method.
      operationId: healthcheckPost
      security: []
      responses:
        "200":
          description: Service reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckResponse"
        "503":
          description: Usage accounting is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /direction:
    post:
      tags:
        - Directions
      summary: Resolves a route between two free-text places
      description: >-
        Geocodes the origin and destination, then routes between them. Costs one unit of the
        monthly quota regardless of how many upstream provider calls that takes.
      operationId: direction
      security:
        - bearerAuth: []
        - auth0: [openid, profile]
      requestBody:
        $ref: "#/components/requestBodies/Direction"
      responses:
        "200":
          description: A route was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectionResponse"
        "400":
          description: Malformed request, or an unsupported travel mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bearer token missing, invalid, or carrying no identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The origin or destination did not resolve, or no route connects them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The monthly quota has been reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The routing provider failed or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /location:
    post:
      tags:
        - PathSearch
      summary: Resolves a free-text query to a formatted address
      operationId: location
      security:
        - bearerAuth: []
        - auth0: [openid, profile]
      requestBody:
        $ref: "#/components/requestBodies/Location"
      responses:
        "200":
          description: A place was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bearer token missing, invalid, or carrying no identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The query resolved to no place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The monthly quota has been reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The geocoding provider failed or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
externalDocs:
  description: Find out more about Cli-Path on GitHub
  url: https://github.com/iosifv/cli-path
servers:
  - url: https://cli-path.vercel.app/api/
    description: Production (Vercel)
  - url: http://localhost:3000/api/
    description: Local development (vercel dev)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token from the CLI's device authorization flow
    auth0:
      type: oauth2
      description: >-
        Sign in via Auth0 to get a token automatically. Uses the same public client_id as the
        CLI; the API only forwards the token to Auth0 /userinfo, so any Auth0 grant works.
      flows:
        authorizationCode:
          authorizationUrl: https://iosifv.eu.auth0.com/authorize
          tokenUrl: https://iosifv.eu.auth0.com/oauth/token
          scopes:
            openid: Required for a usable identity token
            profile: Name/nickname used to identify the caller
  requestBodies:
    Direction:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Direction"
      description: Origin and destination to route between, with an optional travel mode
      required: true
    Location:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Location"
      description: Free-text place query to resolve
      required: true
  schemas:
    Direction:
      type: object
      required:
        - origin
        - destination
      properties:
        origin:
          type: string
          minLength: 1
          maxLength: 200
          example: Amsterdam
        destination:
          type: string
          minLength: 1
          maxLength: 200
          example: Berlin
        profile:
          type: string
          description: Travel mode; defaults to driving when omitted
          enum:
            - driving-car
            - driving-hgv
            - cycling-regular
            - cycling-road
            - cycling-mountain
            - cycling-electric
            - foot-walking
            - foot-hiking
            - wheelchair
      additionalProperties: false
      xml:
        name: Direction
    Location:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
          example: Rijksmuseum
          description: A free-text place query
      additionalProperties: false
      xml:
        name: Location
    Quota:
      type: object
      properties:
        monthly_call_count:
          type: integer
          description: Lookups performed so far this calendar month
          example: 42
        monthly_call_limit:
          type: integer
          description: The configured monthly cap
          example: 1000
    HealthcheckResponse:
      type: object
      properties:
        message:
          type: string
          example: Success!
        status_code:
          type: string
          example: OK
        configured:
          type: object
          properties:
            routing_provider:
              type: boolean
              description: Whether an OpenRouteService key is configured
            usage_counter:
              type: boolean
              description: Whether the Redis usage store is configured
            quota_enforced:
              type: boolean
              description: False only when quota enforcement is explicitly disabled
        monthly_call_count:
          type: integer
        monthly_call_limit:
          type: integer
    DirectionResponse:
      allOf:
        - $ref: "#/components/schemas/Quota"
        - type: object
          properties:
            message:
              type: string
              example: Success!
            status_code:
              type: string
              example: OK
            direction:
              type: object
              description: The five fields cli-app/utils/style.js print.direction() renders verbatim
              properties:
                start:
                  type: string
                  example: Amsterdam, Netherlands
                end:
                  type: string
                  example: Berlin, Germany
                summary:
                  type: string
                  example: A10 and A2
                distance:
                  type: string
                  example: 649 km
                duration:
                  type: string
                  example: 6 hr 12 min
    LocationResponse:
      allOf:
        - $ref: "#/components/schemas/Quota"
        - type: object
          properties:
            message:
              type: string
              example: Success!
            status_code:
              type: string
              example: OK
            formatted_address:
              type: string
              example: Rijksmuseum, Amsterdam, NH, Netherlands
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: That place could not be found.
        status_code:
          type: string
          description: Machine-readable outcome; diagnostic only, never the sole way to detect failure
          example: NOT_FOUND
        error:
          description: Present on some failures; upstream or validation detail
security:
  - bearerAuth: []
  - auth0: [openid, profile]
